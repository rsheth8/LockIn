name: LockIn
options:
  bundleIdPrefix: com.rahilsheth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
settings:
  DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID
targets:
  LockIn:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources
    dependencies:
      - target: LockInMonitor
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        # Spaced so system dialogs don't render the capital I as a lowercase L
        # ("Lockln"). The in-app wordmark uses the uppercase treatment for the
        # same reason — see Wordmark in ScreenHeader.swift.
        CFBundleDisplayName: "Lock In"
        NSHealthShareUsageDescription: "Lock In reads your weight, workouts, and sleep from Health to track progress toward your goal."
        NSHealthUpdateUsageDescription: "Lock In logs workouts and weight to Health so everything stays in sync."
        NSCalendarsUsageDescription: "Lock In reads your calendar to schedule meals and workouts around class/work without conflicts."
        NSCalendarsFullAccessUsageDescription: "Lock In reads your calendar to schedule meals and workouts around class/work without conflicts."
        NSUserNotificationsUsageDescription: "Lock In sends reminders and accountability check-ins to keep you on schedule."
        NSFaceIDUsageDescription: "Used to quickly confirm check-ins."
        NSCameraUsageDescription: "Lock In takes a daily progress photo, stored only on this device, so you can see your physical changes over time."
        UIBackgroundModes:
          - fetch
          - processing
        # Google Sign-In returns to the app through this URL scheme. Replace the
        # placeholder with your REVERSED_CLIENT_ID from the Google Cloud
        # console (it looks like com.googleusercontent.apps.1234-abcd).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    entitlements:
      path: Sources/Resources/LockIn.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.family-controls: true
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rahilsheth.lockin
        com.apple.security.application-groups:
          - group.com.rahilsheth.lockin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahilsheth.lockin
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
        # Overridden in Local.xcconfig (gitignored) with your real reversed
        # client ID. The placeholder lets the project build without it — Google
        # sign-in simply stays hidden until it's configured.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.PLACEHOLDER

  LockInMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: MonitorExtension
      - path: Sources/Models
      - path: Sources/Shared
      - path: Sources/Engines/AccountabilityEngine.swift
      # UserProfile references AppAccent, so the extension needs it in scope
      # even though the extension itself never renders a colour.
      - path: Sources/Design/AppAccent.swift
    info:
      path: MonitorExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInMonitorExtension
    entitlements:
      path: MonitorExtension/LockInMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.rahilsheth.lockin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahilsheth.lockin.monitor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  LockInTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahilsheth.lockin.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true

schemes:
  LockIn:
    build:
      targets:
        LockIn: all
        LockInMonitor: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LockInTests
